name: Verify provenance and bump deployment
description: >-
  Verify that the given image digest was built by the trusted build workflow from
  the commit that triggered this workflow, and if so, update the deployment manifest
  in <owner>/cluster-config to use that digest and create a PR to merge it.

inputs:
  digest:
    description: "Image digest to verify and deploy, e.g. sha256:<64 hex>"
    required: true
  registry:
    description: "Registry hostname"
    required: false
    default: ghcr.io
  registry-username:
    description: "Username for registry login (needed to pull the manifest for verification)"
    required: true
  registry-token:
    description: "Token for registry login and attestation lookup (read access to the app repo)"
    required: true
  deploy-repo-token:
    description: "Token with contents write + PR access to <owner>/cluster-config"
    required: true

runs:
  using: composite
  steps:
    - name: Authenticate to registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-token }}

    - name: Verify provenance is from the trusted builder and from this commit
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.registry-token }}
        IMAGE: ${{ inputs.registry }}/${{ github.repository }}
        DIGEST: ${{ inputs.digest }}
        OWNER: ${{ github.repository_owner }}
        SOURCE_DIGEST: ${{ github.sha }}
        SIGNER_WORKFLOW: the-most-secure-supply-chain-ever-maaan/workflows/.github/workflows/build.yaml
      run: |
        set -euo pipefail

        gh attestation verify "oci://${IMAGE}@${DIGEST}" \
          --owner "$OWNER" \
          --signer-workflow "$SIGNER_WORKFLOW" \
          --predicate-type https://slsa.dev/provenance/v1 \
          --source-digest "$SOURCE_DIGEST"

        echo "Verified ${IMAGE}@${DIGEST} was built by ${SIGNER_WORKFLOW} from ${OWNER}/${GITHUB_REPOSITORY#*/}@${SOURCE_DIGEST}"

    - name: Check out deploy repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository_owner }}/cluster-config
        ref: main
        token: ${{ inputs.deploy-repo-token }}
        path: deploy-repo

    - name: Bump image digest
      shell: bash
      working-directory: deploy-repo
      env:
        GH_TOKEN: ${{ inputs.deploy-repo-token }}
        IMAGE: ${{ inputs.registry }}/${{ github.repository }}
        DIGEST: ${{ inputs.digest }}
      run: |
        set -euo pipefail

        # Fixed apps/<repo>/deployment.yml convention, derived from the
        # caller's own repo name, so a caller can only bump its own manifest.
        APP="${GITHUB_REPOSITORY#*/}"
        DEPLOYMENT_FILE="apps/${APP}/deployment.yml"

        if [[ ! -f "$DEPLOYMENT_FILE" ]]; then
          echo "::error::No deployment manifest at $DEPLOYMENT_FILE in cluster-config"
          exit 1
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        sed -i -E "s|(image: ${IMAGE}@)sha256:[a-f0-9]+|\1${DIGEST}|" "$DEPLOYMENT_FILE"

        if git diff --quiet -- "$DEPLOYMENT_FILE"; then
          echo "$DEPLOYMENT_FILE is already at ${DIGEST}, nothing to bump"
          exit 0
        fi

        BRANCH="bump-${APP}-${DIGEST:7:12}"
        git checkout -b "$BRANCH"
        git commit -am "Bump ${APP} to ${DIGEST}"
        git push --force-with-lease origin "$BRANCH"

        if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
          gh pr create --base main --head "$BRANCH" \
            --title "Bump ${APP} to ${DIGEST}" \
            --body "Provenance verified: built by the trusted build workflow from ${GITHUB_REPOSITORY}@${GITHUB_SHA}."
        fi
        gh pr merge "$BRANCH" --auto --squash --delete-branch
