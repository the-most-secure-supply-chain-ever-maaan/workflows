name: Verify packages

on:
  workflow_call:

permissions:
  contents: read

env:
  SCOPE: "@the-most-secure-supply-chain-ever-maaan"
  SIGNER_WORKFLOW: "the-most-secure-supply-chain-ever-maaan/workflows/.github/workflows/build-package.yml"
  REGISTRY: "https://npm.pkg.github.com"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify attestations for internal packages
        env:
          GH_TOKEN: ${{ github.token }}
          
        run: |
          set -euo pipefail

          ORG="the-most-secure-supply-chain-ever-maaan"
          SCOPE="@${ORG}"
          REG="https://npm.pkg.github.com/"
          SIGNER_ID="https://github.com/${ORG}/workflows/.github/workflows/build-package.yml@refs/heads/main"
          WORK=$(mktemp -d)

          jq -e '(.lockfileVersion // 0) >= 2' package-lock.json >/dev/null \
            || { echo "::error::Krever lockfileVersion >= 2"; exit 1; }

          # Alt under scopet (uansett nesting) ELLER alt fra GitHub-registryet.
          # "-" som fyll, fordi tab er IFS-whitespace og tomme felt ellers kollapser.
          jq -r --arg s "node_modules/${SCOPE}/" --arg r "$REG" '
            .packages | to_entries[]
            | select(.key != "")
            | select((.key | contains($s)) or ((.value.resolved // "") | startswith($r)))
            | [ (.value.name // (.key | sub(".*node_modules/"; ""))),
                (.value.version   // "-"),
                (.value.resolved  // "-"),
                (.value.integrity // "-") ]
            | @tsv' package-lock.json > "$WORK/list.tsv"

          if [ ! -s "$WORK/list.tsv" ]; then
            echo "Ingen interne pakker under $SCOPE"
            exit 0
          fi

          NAME_RE="^${SCOPE}/[a-z0-9][a-z0-9._-]*$"
          VER_RE='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          FAILED=0
          declare -A SEEN
          i=0

          while IFS=$'\t' read -r NAME VERSION RESOLVED INTEGRITY; do
            i=$((i+1))

            # Valider ALT før noe skrives til logg eller sendes til verktøy
            if [[ ! "$NAME" =~ $NAME_RE ]] || [[ ! "$VERSION" =~ $VER_RE ]]; then
              echo "::error::Oppføring $i: ugyldig navn/versjon (alias eller spec-injeksjon?)"
              FAILED=1; continue
            fi
            if [[ "$RESOLVED" != "${REG}"* ]]; then
              echo "::error::$NAME@$VERSION resolves ikke fra $REG"
              FAILED=1; continue
            fi
            if [[ "$INTEGRITY" != sha512-* || "$INTEGRITY" == *" "* ]]; then
              echo "::error::$NAME@$VERSION mangler entydig sha512-integrity"
              FAILED=1; continue
            fi

            [[ -n "${SEEN[$RESOLVED]:-}" ]] && continue
            SEEN[$RESOLVED]=1

            echo "::group::$NAME@$VERSION"
            FILE="$WORK/pkg-$i.tgz"

            # Hent pakke fra GitHub-registryet
            curl -fsSL --proto '=https' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -o "$FILE" "$RESOLVED"

            # Sjekk integritet av nedlastet pakke og verifiser attestasjon
            ACTUAL="sha512-$(openssl dgst -sha512 -binary "$FILE" | base64 -w0)"
            if [[ "$ACTUAL" != "$INTEGRITY" ]]; then
              echo "::error::Integrity-mismatch for $NAME@$VERSION"
              FAILED=1
            else
              gh attestation verify "$FILE" \
                --repo "${ORG}/${NAME#"${SCOPE}/"}" \
                --cert-identity "$SIGNER_ID" \
                --predicate-type https://slsa.dev/provenance/v1 \
                --source-ref refs/heads/main \
                --deny-self-hosted-runners \
                || FAILED=1
            fi

            rm -f "$FILE"
            echo "::endgroup::"
          done < "$WORK/list.tsv"

          [ "$FAILED" -eq 0 ] || {
            echo "::error::En eller flere interne pakker mangler gyldig attestasjon"
            exit 1
          }