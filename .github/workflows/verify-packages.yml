name: Verify packages

on:
  workflow_call:

env:
  ORG: "the-most-secure-supply-chain-ever-maaan"
  SOURCE_REF: "refs/heads/main"
  REGISTRY: "https://npm.pkg.github.com/" # trailing slash hindrer host-spoofing
  ALLOWED_SIGNER: '^https://github[.]com/the-most-secure-supply-chain-ever-maaan/workflows/[.]github/workflows/build-package[.]yml@.*$'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check lockfile format
        shell: bash
        run: |
          jq -e '((.lockfileVersion // 0) >= 2) and ((.packages | type) == "object")' \
          package-lock.json >/dev/null \
          || { echo "::error::Krever lockfileVersion >= 2"; exit 1; }

      - name: Check dependency sources
        shell: bash
        run: |
          set -euo pipefail

          # Tillatt: npmjs eller GitHub-registryet med sha512
          BAD=$(jq -r --arg gh "$REGISTRY" --arg npm "https://registry.npmjs.org/" '
            .packages | to_entries[]
            | select(.key | contains("node_modules/"))
            | select(.value.inBundle != true)
            | select(
                ((.value.resolved // "") | (startswith($gh) or startswith($npm)) | not)
                or ((.value.integrity // "") | startswith("sha512-") | not))
            | .key | @json' package-lock.json)

          if [ -n "$BAD" ]; then
            echo "::error::Avhengigheter fra ikke-tillatt kilde eller uten sha512-integrity:"
            printf '%s\n' "$BAD"
            exit 1
          fi

      - name: Verify attestations for internal packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
 
          SCOPE="@${ORG}"
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
 
          list_internal_packages() {
            # Tomme felt fylles med "-", ellers forskyves kolonnene
            jq -r --arg scope "node_modules/${SCOPE}/" --arg registry "$REGISTRY" '
              .packages | to_entries[]
              | select(.key != "")
              | select((.key | contains($scope)) or ((.value.resolved // "") | startswith($registry)))
              | [ .value.name // (.key | sub(".*node_modules/"; "")),
                  .value.version // "-",
                  .value.resolved // "-",
                  .value.integrity // "-" ]
              | @tsv' package-lock.json
          }

          is_valid_lockfile_entry() {
            local name=$1 version=$2 resolved=$3 integrity=$4
            if [[ ! "$name" =~ ^${SCOPE}/[a-z0-9][a-z0-9._-]*$ ]] || [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Ugyldig pakkenavn eller versjon i package-lock.json"; return 1
            fi
            if [[ "$resolved" != "${REGISTRY}"* ]]; then
              echo "::error::$name@$version resolves ikke fra $REGISTRY"; return 1
            fi
            if [[ "$integrity" != sha512-* || "$integrity" == *" "* ]]; then
              echo "::error::$name@$version mangler entydig sha512-integrity"; return 1
            fi
          }
 
          download_package() {
            local url=$1 file=$2
            curl -fsSL --proto '=https' --proto-redir '=https' \
              -H @<(printf 'Authorization: Bearer %s\n' "$GH_TOKEN") \
              -o "$file" "$url"
          }

          verify_package_integrity() {
            local file=$1 expected=$2
            local actual
            actual="sha512-$(openssl dgst -sha512 -binary "$file" | base64 -w0)"
            [[ "$actual" == "$expected" ]]
          }

          verify_package_attestation() {
            local file=$1 name=$2
            local repo="${ORG}/${name#"${SCOPE}/"}" # @org/shared-lib -> org/shared-lib
            gh attestation verify "$file" \
              --repo "$repo" \
              --cert-identity-regex "$ALLOWED_SIGNER" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --source-ref "$SOURCE_REF" \
              --deny-self-hosted-runners
          }

          list_internal_packages | sort -u > "$WORK/list.tsv"
          if [ ! -s "$WORK/list.tsv" ]; then
            echo "Ingen interne pakker under $SCOPE"
            exit 0
          fi

          failed=0
          verified_packages=()

          while IFS=$'\t' read -r name version resolved integrity; do
            is_valid_lockfile_entry "$name" "$version" "$resolved" "$integrity" || { failed=1; continue; }

            echo "::group::$name@$version"
            file="$WORK/package.tgz"

            if ! download_package "$resolved" "$file"; then
              echo "::error::Kunne ikke laste ned $name@$version"; failed=1
            elif ! verify_package_integrity "$file" "$integrity"; then
              echo "::error::Integrity-mismatch for $name@$version"; failed=1
            elif ! verify_package_attestation "$file" "$name"; then
              echo "::error::Attestasjon feilet for $name@$version"; failed=1
            else
              verified_packages+=("$name@$version")
            fi

            rm -f "$file"
            echo "::endgroup::"
          done < "$WORK/list.tsv"

          echo "Verifisert ${#verified_packages[@]} interne pakker:"
          if [ ${#verified_packages[@]} -gt 0 ]; then
            printf '  %s\n' "${verified_packages[@]}"
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::En eller flere interne pakker mangler gyldig attestasjon"
            exit 1
          fi
