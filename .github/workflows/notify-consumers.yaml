name: Bump shared workflow SHAs in consumers

# Når en av de delte workflowene merges til main, åpnes det PR i repoet
# som kaller dem, med commit-SHA-en til dette repoet.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yaml"
      - ".github/workflows/verify-and-bump-deployment.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: the-most-secure-supply-chain-ever-maaan/thunderbolt
          token: ${{ secrets.CONSUMER_PAT }}

      - name: Oppdater SHA i uses-linjene
        env:
          NEW_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          shared_workflows=(
            "build.yaml"
            "verify-and-bump-deployment.yaml"
          )

          for wf in "${shared_workflows[@]}"; do
            pin="uses: ${REPO}/.github/workflows/${wf}@"

            if ! grep -qF "$pin" .github/workflows/*.y*ml; then
              echo "Fant ingen pinning av ${wf}. Er den fjernet eller omdopt?"
              exit 1
            fi

            # Escape punktum, ellers matcher de vilkarlige tegn i regexen
            pattern="${pin//./\\.}"
            sed -i -E "s|(${pattern})[0-9a-f]{40}|\\1${NEW_SHA}|g" .github/workflows/*.y*ml
          done

          git diff --color=always

      - name: Åpne PR
        env:
          NEW_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.CONSUMER_PAT }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Allerede oppdatert, ingenting å gjøre."
            exit 0
          fi

          branch="bump-shared-workflows-${NEW_SHA:0:7}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Bump delte workflows til ${NEW_SHA}"
          git push --force origin "$branch"

          gh pr create --head "$branch" --base main \
            --title "Bump delte workflows til ${NEW_SHA:0:7}" \
            --body "Automatisk PR fra \`${REPO}\`. Delte workflows er oppdatert til \`${NEW_SHA}\`." \
            || echo "PR finnes allerede."
