name: Build application

on:
  workflow_call:
    outputs:
      digest:
        description: "Digest til det pushede imaget"
        value: ${{ jobs.build-source.outputs.digest }}
    secrets:
      deploy-repo-token:
        description: >-
          Token with contents write + PR access to <owner>/cluster-config.
        required: true

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write
  security-events: write
  artifact-metadata: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-source:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build_image.outputs.digest }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to private Docker registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker build
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up QEMU
        id: setup-qemu
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: scan_image
        if: github.event_name == 'pull_request'
        with:
          context: .
          load: true
          tags: scan-target:local

      - name: Push Docker image to registry
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build_image
        if: github.event_name == 'push'
        with:
          platforms: "linux/amd64,linux/arm64"
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.3.6
        with:
          image-ref: ${{ github.event_name == 'pull_request' && 'scan-target:local' || format('{0}/{1}@{2}', env.REGISTRY, env.IMAGE_NAME, steps.build_image.outputs.digest) }}
          format: "sarif"
          output: "trivy-results.sarif"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan findings to GitHub Security tab
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Generate attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build_image.outputs.digest }}
          push-to-registry: true

  verify-and-update-digest:
    name: Verify Provenance and Update Deployment
    needs: build-source
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: bump-${{ github.repository_owner }}-cluster-config-main
    steps:
      - name: Authenticate to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify provenance is from the trusted builder and from this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build-source.outputs.digest }}
          OWNER: ${{ github.repository_owner }}

          SOURCE_DIGEST: ${{ github.sha }}
          SIGNER_WORKFLOW: the-most-secure-supply-chain-ever-maaan/workflows/.github/workflows/build.yaml
        run: |
          set -euo pipefail

          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --owner "$OWNER" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --source-digest "$SOURCE_DIGEST"

          echo "Verified ${IMAGE}@${DIGEST} was built by ${SIGNER_WORKFLOW} from ${GITHUB_REPOSITORY}@${SOURCE_DIGEST}"

      - name: Check out deploy repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/cluster-config
          ref: main
          token: ${{ secrets.deploy-repo-token }}
          path: deploy-repo

      - name: Bump image digest
        working-directory: deploy-repo
        env:
          GH_TOKEN: ${{ secrets.deploy-repo-token }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build-source.outputs.digest }}
        run: |
          set -euo pipefail

          # Fixed apps/<repo>/deployment.yml convention, derived from the
          # caller's own repo name, so a caller can only bump its own manifest.
          APP="${GITHUB_REPOSITORY#*/}"
          DEPLOYMENT_FILE="apps/${APP}/deployment.yml"

          if [[ ! -f "$DEPLOYMENT_FILE" ]]; then
            echo "::error::No deployment manifest at $DEPLOYMENT_FILE in cluster-config"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          sed -i -E "s|(image: ${IMAGE}@)sha256:[a-f0-9]+|\1${DIGEST}|" "$DEPLOYMENT_FILE"

          if git diff --quiet -- "$DEPLOYMENT_FILE"; then
            echo "$DEPLOYMENT_FILE is already at ${DIGEST}, nothing to bump"
            exit 0
          fi

          BRANCH="bump-${APP}-${DIGEST:7:12}"
          git checkout -b "$BRANCH"
          git commit -am "Bump ${APP} to ${DIGEST}"
          git push --force-with-lease origin "$BRANCH"

          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr create --base main --head "$BRANCH" \
              --title "Bump ${APP} to ${DIGEST}" \
              --body "Provenance verified: built by the trusted build workflow from ${GITHUB_REPOSITORY}@${GITHUB_SHA}."
          fi
          gh pr merge "$BRANCH" --auto --squash --delete-branch
