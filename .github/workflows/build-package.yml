name: Build Node.js package

on:
  workflow_call:
    outputs:
      digest:
        description: "Digest til den publiserte pakken"
        value: ${{ jobs.publish.outputs.digest }}

jobs:
  verify-dependencies:
    uses: $/.github/workflows/verify-packages.yml
    permissions:
      contents: read
      packages: read
      attestations: read

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check version bump
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE=$(git show HEAD^1:package.json | jq -r .version)
          PR=$(jq -r .version package.json)

          if [[ ! "$PR" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=package.json::Ugyldig versjon '$PR'. Bare X.Y.Z er tillatt."
            exit 1
          fi

          HIGHEST=$(printf '%s\n' "$BASE" "$PR" | sort -V | tail -n1)

          if [[ "$PR" == "$BASE" || "$PR" != "$HIGHEST"   ]] ; then
            echo "::error file=package.json::Versjonen må økes ($BASE → $PR). Kjør: npm version minor --no-git-tag-version og commit package.json + package-lock.json"
            exit 1
          fi

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Trivy dependency scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

      - name: Pack package
        env:
          IS_RELEASE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || ''}}
        id: pack
        run: |
          set -euo pipefail
          TARBALL=$(npm pack --ignore-scripts --json ${{ (!(env.IS_RELEASE) && '--dry-run') || ''}} | jq -r '.[0].filename')
          if [ "$IS_RELEASE" ]; then
            echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
            echo "digest=sha256:$(sha256sum "$TARBALL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload tarball
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: ${{ steps.pack.outputs.tarball }}
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ needs.build.outputs.digest }}
    steps:
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball

      - name: Verify digest is unchanged
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          EXPECTED: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          ACTUAL="sha256:$(sha256sum "$TARBALL" | cut -d' ' -f1)"
          [ "$ACTUAL" = "$EXPECTED" ] || {
            echo "::error::Digest endret seg: $ACTUAL != $EXPECTED"; exit 1;
          }

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com

      - name: Attest package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ needs.build.outputs.tarball }}

      - name: Publish package
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish "$TARBALL" --ignore-scripts
