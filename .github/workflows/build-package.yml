name: Build Node.js package

on: 
  workflow_call:
    outputs:
      digest:
        description: "Digest til den publiserte pakken"
        value: ${{ jobs.publish-package.outputs.digest }}

permissions:
  contents: read

env:
  REGISTRY_URL: https://npm.pkg.github.com

jobs:
  publish-package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
      
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Trivy dependency scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

      - name: Pack package
        id: pack
        run: |
          TARBALL=$(npm pack --json | jq -r '.[0].filename')
          echo "TARBALL=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "digest=sha256:$(sha256sum "$TARBALL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Attest package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.TARBALL }}

      - name: Publish package
        run: npm publish "${{ steps.pack.outputs.TARBALL }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}