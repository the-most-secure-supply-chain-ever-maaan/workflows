name: Verify Provenance and Bump Deployment

on:
  workflow_call:
    inputs:
      digest:
        description: "Image digest to verify and deploy, e.g. sha256:..."
        required: true
        type: string
      registry-username:
        description: "Username for registry login (needed to pull the manifest for verification)"
        required: true
        type: string
      registry:
        description: "Registry hostname"
        required: false
        type: string
        default: "ghcr.io"
      base-branch:
        description: "Branch in deploy-repo to push the bump to"
        required: false
        type: string
        default: "main"
    secrets:
      registry-token:
        description: "Token for registry login"
        required: true
      deploy-repo-token:
        description: "Token with contents write access to deploy-repo"
        required: true

permissions:
  contents: read

jobs:
  verify-and-bump:
    runs-on: ubuntu-latest
    concurrency:
      group: bump-${{ github.repository_owner }}-cluster-config-${{ inputs.base-branch }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      DIGEST: ${{ inputs.digest }}
    steps:
      - name: Validate digest format
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Invalid digest format: $DIGEST"; exit 1; }

      - name: Authenticate to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-username }}
          password: ${{ secrets.registry-token }}

      - name: Verify SLSA provenance for built digest
        env:
          GH_TOKEN: ${{ secrets.registry-token }}
          OWNER: ${{ github.repository_owner }}
          SIGNER_WORKFLOW: the-most-secure-supply-chain-ever-maaan/workflows/.github/workflows/build.yaml
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --owner "${OWNER}" \
            --signer-workflow "${SIGNER_WORKFLOW}"

      - name: Checkout deploy repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/cluster-config
          ref: ${{ inputs.base-branch }}
          token: ${{ secrets.deploy-repo-token }}
          path: deploy-repo

      - name: Bump image digest
        shell: bash
        working-directory: deploy-repo
        run: |
          # Deployment file path follows the fixed apps/<repo>/deployment.yml
          # convention, derived from the caller's own repo name, so a caller
          # can only ever bump its own manifest.
          DEPLOYMENT_FILE="apps/${GITHUB_REPOSITORY#*/}/deployment.yml"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i -E "s|(image: ${IMAGE}@)sha256:[a-f0-9]+|\1${DIGEST}|" "$DEPLOYMENT_FILE"
          if git diff --exit-code "$DEPLOYMENT_FILE"; then
            echo "No change, skipping"
            exit 0
          fi
          git commit -am "Bump $(basename "${IMAGE}") to ${DIGEST}"
          git push origin HEAD
