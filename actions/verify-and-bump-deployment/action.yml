name: Verify Provenance and Bump Deployment
description: >
  Verifies SLSA provenance for a built image digest, then bumps the image
  digest in a deployment manifest in a target GitOps repo via an
  auto-merged pull request.

inputs:
  image:
    description: "Fully qualified image ref without digest, e.g. ghcr.io/org/app"
    required: true
  digest:
    description: "Image digest to verify and deploy, e.g. sha256:..."
    required: true
  owner:
    description: "GitHub org/user that owns the image, used for gh attestation verify --owner"
    required: true
  signer-workflow:
    description: "Trusted workflow identity that must have signed the attestation, e.g. org/workflows/.github/workflows/build.yaml"
    required: true
  registry-username:
    description: "Username for registry login (needed to pull the manifest for verification)"
    required: true
  registry-token:
    description: "Token for registry login"
    required: true
  registry:
    description: "Registry hostname"
    required: false
    default: "ghcr.io"
  deploy-repo:
    description: "owner/repo of the GitOps repo containing the deployment manifest"
    required: true
  deploy-repo-token:
    description: "Token with contents + pull-request write access to deploy-repo"
    required: true
  deployment-file:
    description: "Path within deploy-repo to the manifest containing the image digest"
    required: true
  base-branch:
    description: "Branch in deploy-repo to open the PR against"
    required: false
    default: "main"

runs:
  using: composite
  steps:
    - name: Authenticate to registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-token }}

    - name: Verify SLSA provenance for built digest
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.registry-token }}
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
        OWNER: ${{ inputs.owner }}
        SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
      run: |
        gh attestation verify "oci://${IMAGE}@${DIGEST}" \
          --owner "${OWNER}" \
          --signer-workflow "${SIGNER_WORKFLOW}"

    - name: Checkout deploy repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ inputs.deploy-repo }}
        ref: ${{ inputs.base-branch }}
        token: ${{ inputs.deploy-repo-token }}
        path: __deploy-repo

    - name: Bump image digest
      shell: bash
      working-directory: __deploy-repo
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
        DEPLOYMENT_FILE: ${{ inputs.deployment-file }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        BRANCH="bump-$(basename "${IMAGE}")-${DIGEST#sha256:}"
        BRANCH="${BRANCH:0:50}"
        git checkout -b "$BRANCH"
        sed -i -E "s|(image: ${IMAGE}@)sha256:[a-f0-9]+|\1${DIGEST}|" "$DEPLOYMENT_FILE"
        if git diff --exit-code "$DEPLOYMENT_FILE"; then
          echo "No change, skipping"
          exit 0
        fi
        git commit -am "Bump $(basename "${IMAGE}") to ${DIGEST}"
        git push origin "$BRANCH"
        echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

    - name: Open and auto-merge PR
      if: env.BRANCH != ''
      shell: bash
      working-directory: __deploy-repo
      env:
        GH_TOKEN: ${{ inputs.deploy-repo-token }}
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
        BASE_BRANCH: ${{ inputs.base-branch }}
      run: |
        PR_URL=$(gh pr create \
          --title "Bump $(basename "${IMAGE}") to ${DIGEST}" \
          --body "Automated bump after verified SLSA provenance for ${IMAGE}@${DIGEST}." \
          --base "${BASE_BRANCH}" --head "$BRANCH")
        gh pr merge "$PR_URL" --squash --auto
